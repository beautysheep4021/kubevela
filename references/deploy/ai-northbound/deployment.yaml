apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-northbound
  namespace: ai-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-northbound
rules:
  - apiGroups: ["core.oam.dev"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-northbound
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-northbound
subjects:
  - kind: ServiceAccount
    name: ai-northbound
    namespace: ai-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-northbound
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-northbound
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-northbound
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-northbound
    spec:
      serviceAccountName: ai-northbound
      containers:
        - name: ai-northbound
          image: ghcr.io/beautysheep4021/kubevela-ai-northbound:dev
          imagePullPolicy: IfNotPresent
          args:
            - -addr
            - 0.0.0.0:8088
          ports:
            - name: http
              containerPort: 8088
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: ai-northbound
  namespace: ai-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-northbound
  ports:
    - name: http
      port: 80
      targetPort: http
