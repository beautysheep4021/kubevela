apiVersion: ai.oam.dev/v1alpha1
kind: AIJob
metadata:
  name: ai-job-domain-demo
  namespace: sock-shop
spec:
  componentName: batch-evaluator
  properties:
    image: busybox:1.36
    jobKind: evaluation
    cmd:
      - sh
      - -c
    args:
      - echo evaluation-ok
    dataset:
      name: eval-set
      uri: oss://datasets/eval-set/v1
    output:
      uri: oss://outputs/eval-run/v1
    backoffLimit: 0
    ttlSecondsAfterFinished: 300
  runtime:
    runtime: batch
    framework: shell
    tenant: demo-tenant
    project: evaluation
    environment: poc
    datasetURI: oss://datasets/eval-set/v1
    owner: ai-platform
  placement:
    namespace: sock-shop
    clusters:
      - local
