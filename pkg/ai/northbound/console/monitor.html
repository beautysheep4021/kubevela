<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K8s 管理员工作台 · 智算纳管</title>
    <script>if(new URLSearchParams(location.search).get("embed")==="1")document.documentElement.classList.add("embedded");</script>
    <link rel="stylesheet" href="__BASE_PATH__/console/styles.css" />
    <link rel="stylesheet" href="__BASE_PATH__/console/monitor.css" />
    <script defer src="__BASE_PATH__/console/lucide.js"></script>
    <script defer src="__BASE_PATH__/console/state.js"></script>
    <script defer src="__BASE_PATH__/console/ui.js"></script>
    <script defer src="__BASE_PATH__/console/monitor-state.js"></script>
    <script defer src="__BASE_PATH__/console/api.js"></script>
    <script defer src="__BASE_PATH__/console/monitor-api.js"></script>
    <script defer src="__BASE_PATH__/console/monitor.js"></script>
  </head>
  <body data-role="monitor" data-base-path="__BASE_PATH__" data-account-username="__ACCOUNT_USERNAME__">
    <div class="shell">
      <header class="topbar">
        <button id="nav-toggle" class="icon-button" title="展开导航" aria-label="展开导航" aria-expanded="false">
          <i data-lucide="menu"></i>
        </button>
        <a class="brand" href="#/overview"
          ><img src="__BASE_PATH__/console/brand.svg" alt="" width="26" height="26" /><span
            >智算纳管<small>AI MONITOR</small></span
          ></a
        >
        <div class="scope" title="当前观测范围">
          <i data-lucide="activity"></i
          ><span>监控台<small id="scope-current">全部命名空间</small></span>
        </div>
        <span id="environment" class="environment"></span>
        <span class="account"><span class="avatar" aria-hidden="true"></span>__ACCOUNT_USERNAME__</span>
        <form action="__BASE_PATH__/logout" method="post" id="logout-form">
          <button class="icon-button" title="退出登录" aria-label="退出登录">
            <i data-lucide="log-out"></i>
          </button>
        </form>
      </header>
      <aside class="sidebar" aria-label="主导航">
        <nav>
          <div class="nav-group">
            <button type="button" class="nav-group-head" data-nav-group aria-expanded="true"><span>监控</span><i data-lucide="chevron-up"></i></button>
            <div class="nav-group-items">
              <a class="nav-link" href="#/overview" data-nav="overview" title="总览"><i data-lucide="layout-dashboard"></i><span>总览</span></a>
            </div>
          </div>
          <div class="nav-group">
            <button type="button" class="nav-group-head" data-nav-group aria-expanded="true"><span>运行对象</span><i data-lucide="chevron-up"></i></button>
            <div class="nav-group-items">
              <a class="nav-link" href="#/jobs" data-nav="jobs" title="任务"><i data-lucide="list-checks"></i><span>任务</span></a>
              <a class="nav-link" href="#/services" data-nav="services" title="在线服务"><i data-lucide="radio-tower"></i><span>在线服务</span></a>
            </div>
          </div>
          <div class="nav-group">
            <button type="button" class="nav-group-head" data-nav-group aria-expanded="true"><span>治理</span><i data-lucide="chevron-up"></i></button>
            <div class="nav-group-items">
              <a class="nav-link" href="#/tenants" data-nav="tenants" title="租户资源"><i data-lucide="layers"></i><span>租户资源</span></a>
              <a class="nav-link" href="#/audits" data-nav="audits" title="操作审计"><i data-lucide="history"></i><span>操作审计</span></a>
            </div>
          </div>
        </nav>
        <div class="sidebar-footer">
          <span class="subtle">K8s 管理员</span><span>__ACCOUNT_USERNAME__</span>
        </div>
        <button type="button" id="nav-collapse" class="sidebar-collapse" title="收起或展开导航" aria-label="收起或展开导航"><i data-lucide="panel-left"></i></button>
      </aside>
      <div class="main">
        <main id="page" tabindex="-1" aria-label="监控内容"></main>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>请启用 JavaScript 后访问监控台。</noscript>
  </body>
</html>
